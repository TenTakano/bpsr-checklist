name: Upstream Sync

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure labels exist
        run: |
          set -euo pipefail
          gh label create "upstream-sync" --color "0E8A16" --description "upstream のタスク定義の変更検知" --force --repo "$REPO"
          gh label create "upstream-sync-failure" --color "B60205" --description "upstream 同期 workflow の失敗" --force --repo "$REPO"

      - name: Check for upstream changes
        id: check
        run: |
          set -euo pipefail

          LATEST_SHA=$(curl -sSfL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/Teawase/blue-protocol-checklist/commits?path=script.js&per_page=1" \
            | jq -r '.[0].sha')

          if ! [[ "$LATEST_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "upstream の最新コミットSHA取得に失敗しました、または形式が不正です: $LATEST_SHA" >&2
            exit 1
          fi

          CURRENT_SHA=$(jq -r '.upstreamCommit // ""' src/data/upstreamTasks.json)
          echo "latest_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"

          if [ "$LATEST_SHA" = "$CURRENT_SHA" ]; then
            echo "upstream に変更なし (SHA: $LATEST_SHA)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "upstream 変更検知: $CURRENT_SHA -> $LATEST_SHA"

          # upstreamCommit only advances when a human applies the change, so the same SHA is
          # detected every day until then. Skip if an open Issue already reports it.
          if gh issue list --repo "$REPO" --label upstream-sync --state open --json title --jq '.[].title' \
            | grep -qF "${LATEST_SHA:0:7}"; then
            echo "この SHA を報告済みの open Issue があるためスキップします"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract upstream tasks
        if: steps.check.outputs.changed == 'true'
        env:
          LATEST_SHA: ${{ steps.check.outputs.latest_sha }}
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://raw.githubusercontent.com/Teawase/blue-protocol-checklist/$LATEST_SHA/script.js" \
            -o "$RUNNER_TEMP/upstream-script.js"
          pnpm extract "$RUNNER_TEMP/upstream-script.js" --upstream-commit "$LATEST_SHA"

      - name: Report diff via Issue
        if: steps.check.outputs.changed == 'true'
        env:
          LATEST_SHA: ${{ steps.check.outputs.latest_sha }}
        run: |
          set -euo pipefail
          git show HEAD:src/data/upstreamTasks.json > "$RUNNER_TEMP/before.json"
          DIFF=$(scripts/diff-upstream-tasks.sh "$RUNNER_TEMP/before.json" src/data/upstreamTasks.json)

          if [ "$(printf '%s' "$DIFF" | jq '[.added, .removed, .changed] | add | length')" = "0" ]; then
            echo "抽出結果に実差分なし（タスクと無関係な upstream コミット）"
            exit 0
          fi

          # Labels come from upstream, so strip backticks to keep them inside the code fence
          DIFF=$(printf '%s' "$DIFF" | tr -d '`' | head -c 60000)
          TITLE="[upstream-sync] 本家のタスク定義が変わりました (${LATEST_SHA:0:7})"
          FENCE='```'
          BODY="upstream のタスク定義の変更を検知しました。取り込むかどうか・どう取り込むかを判断してください。

          - upstream コミット: https://github.com/Teawase/blue-protocol-checklist/commit/$LATEST_SHA
          - 取り込み手順: README の「タスク定義の更新」

          ### 差分（upstream id 単位）

          ${FENCE}json
          $DIFF
          ${FENCE}"

          EXISTING=$(gh issue list --repo "$REPO" --label upstream-sync --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$REPO" --title "$TITLE"
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --label upstream-sync --body "$BODY"
          fi

      - name: Report failure via Issue
        if: failure()
        run: |
          set -euo pipefail
          BODY="upstream 同期 workflow が失敗しました。

          - 実行ログ: ${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}
          - トリガー: ${{ github.event_name }}"

          EXISTING=$(gh issue list --repo "$REPO" --label upstream-sync-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "upstream 同期 workflow が失敗しました" --label upstream-sync-failure --body "$BODY"
          fi
